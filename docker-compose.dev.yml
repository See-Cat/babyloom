services:
  db:
    image: postgres:15-alpine
    container_name: babyloom-dev-db
    environment:
      POSTGRES_DB: babyloom
      POSTGRES_USER: babyloom
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - babyloom-dev-postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  babyloom-dev-postgres:
