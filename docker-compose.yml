version: '3.8'

services:
  api:
    build: ./server
    container_name: babyloom-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=babyloom
      - DB_USER=babyloom
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - STORAGE_PATH=/app/uploads
    volumes:
      - ${NAS_MOUNT_PATH}/uploads:/app/uploads
      - ${NAS_MOUNT_PATH}/config:/app/config
      - ${NAS_MOUNT_PATH}/data:/app/data
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: babyloom-db
    environment:
      - POSTGRES_DB=babyloom
      - POSTGRES_USER=babyloom
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ${NAS_MOUNT_PATH}/data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  client:
    build: ./client
    container_name: babyloom-client
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build: ./admin
    container_name: babyloom-admin
    ports:
      - "3002:80"
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: babyloom-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${NAS_MOUNT_PATH}/ssl:/etc/nginx/ssl:ro
    depends_on:
      - client
      - admin
      - api
    restart: unless-stopped
